name: Hard Reset to Specific Commit

on:
  workflow_dispatch:  # Manual trigger only for safety

jobs:
  hard-reset:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history
          token: ${{ secrets.token }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Hard reset to target commit
        run: |
          echo "Current HEAD: $(git rev-parse HEAD)"
          echo "Target commit: bec8ed4a149bb2d81cecb9a9d8320bbecf2c2a53"
          
          # Hard reset to the specific commit
          git reset --hard bec8ed4a149bb2d81cecb9a9d8320bbecf2c2a53
          
          echo "After reset HEAD: $(git rev-parse HEAD)"
      
      - name: Force push to main branch
        run: |
          # Force push to overwrite remote history
          git push origin HEAD:main --force
        env:
          GITHUB_TOKEN: ${{ secrets.token }}
      
      - name: Verify reset
        run: |
          echo "✅ Repository has been reset to commit bec8ed4a149bb2d81cecb9a9d8320bbecf2c2a53"
          echo "All commits and changes after this point have been removed"
          git log --oneline -5
