<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control Dashboard</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Segoe UI', sans-serif; background: #0f0f1a; color: #e0e0e0; }
      #root { min-height: 100vh; }
      #boot-loader {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f0f1a;
      }
      #boot-loader__content {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #94a3b8;
        font-size: 13px;
        letter-spacing: 0.2px;
      }
      #boot-loader__spinner {
        width: 20px;
        height: 20px;
        border: 2px solid #334155;
        border-top-color: #818cf8;
        border-radius: 50%;
        animation: boot-loader-spin 0.8s linear infinite;
      }
      @keyframes boot-loader-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-CbgkpJeV.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-D3gV8vqN.css">
  </head>
  <body>
    <div id="root">
      <div id="boot-loader" role="status" aria-live="polite" aria-label="Loading dashboard">
        <div id="boot-loader__content">
          <span id="boot-loader__spinner" aria-hidden="true"></span>
          <span>Loading dashboard…</span>
        </div>
      </div>
    </div>
  </body>
</html>
